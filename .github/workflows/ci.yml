name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The shipped extension has no runtime dependencies; this guards that.
      - run: npm audit --omit=dev
      - run: npm run build -- --production
      - name: Bundle stays small and dependency-free
        run: |
          size=$(stat -c %s dist/extension.js)
          echo "bundle: $size bytes"
          test "$size" -lt 150000
          ! grep -q '"dependencies"' package.json

  integration:
    name: Extension host tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Run (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

  package:
    name: Package .vsix
    needs: [check, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: ai-code-reviewer-vsix
          path: "*.vsix"
          if-no-files-found: error
